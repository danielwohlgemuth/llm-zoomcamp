services:
  postgres:
    image: pgvector/pgvector:0.8.3-pg18-trixie
    user: "999:999" # use postgres user to avoid using root
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init-grafana-user.sh:/docker-endpoint-initdb.d/init-grafana-user.sh:ro

  grafana:
    image: grafana/grafana:13.0.11
    env_file:
      - .env
    ports:
      - 3000:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data:
